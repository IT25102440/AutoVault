<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AutoLane — Second-Hand Cars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --black: #0d0d0d;
            --white: #f5f4f0;
            --accent: #e8ff47;
            --grey: #1a1a1a;
            --muted: #888;
            --card-bg: #161616;
            --border: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--black);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: var(--accent) !important;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .navbar-brand span { color: var(--white); }
        .nav-btn {
            border: 1px solid var(--accent);
            color: var(--accent);
            background: transparent;
            padding: 0.4rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .nav-btn:hover {
            background: var(--accent);
            color: var(--black);
        }
        .nav-btn.filled {
            background: var(--accent);
            color: var(--black);
        }
        .nav-btn.filled:hover {
            background: transparent;
            color: var(--accent);
        }

        /* ── HERO ── */
        .hero {
            padding: 5rem 2rem 3rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: 'DRIVE';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 18vw;
            color: rgba(255,255,255,0.03);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }
        .hero h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 0.95;
            letter-spacing: 2px;
            position: relative;
        }
        .hero h1 em {
            font-style: normal;
            color: var(--accent);
        }
        .hero p {
            color: var(--muted);
            font-size: 1rem;
            margin-top: 1rem;
            font-weight: 300;
            position: relative;
        }

        /* ── SEARCH BAR ── */
        .search-wrap {
            max-width: 560px;
            margin: 2.5rem auto 0;
            display: flex;
            gap: 0;
            position: relative;
        }
        .search-wrap input {
            flex: 1;
            background: var(--grey);
            border: 1px solid var(--border);
            border-right: none;
            color: var(--white);
            padding: 0.85rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap button {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: var(--black);
            padding: 0.85rem 1.5rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .search-wrap button:hover { background: transparent; color: var(--accent); }

        /* ── SECTION LABEL ── */
        .section-label {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 2.5rem 2rem 1.5rem;
        }
        .section-label h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }
        .section-label .count {
            background: var(--accent);
            color: var(--black);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            letter-spacing: 1px;
        }
        .divider {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── CAR GRID ── */
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1px;
            padding: 0 2rem 4rem;
            background: var(--border);
        }
        .car-grid > * { background: var(--black); }

        /* ── CAR CARD ── */
        .car-card {
            background: var(--card-bg);
            cursor: pointer;
            transition: background 0.2s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .car-card:hover { background: #1e1e1e; }
        .car-card:hover .card-arrow { transform: translateX(4px); }

        .car-card-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            display: block;
            filter: grayscale(20%);
            transition: filter 0.3s;
        }
        .car-card:hover .car-card-img { filter: grayscale(0%); }

        .car-card-img-placeholder {
            width: 100%;
            aspect-ratio: 16/10;
            background: var(--grey);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 2rem;
        }

        .car-card-body {
            padding: 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .car-card-brand {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .car-card-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
            line-height: 1.1;
            margin-bottom: 0.8rem;
        }
        .car-card-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 1rem;
        }
        .car-card-meta span::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            background: var(--muted);
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        .car-card-meta span:first-child::before { display: none; }

        .car-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .car-card-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            color: var(--white);
        }
        .card-arrow {
            font-size: 1.2rem;
            color: var(--accent);
            transition: transform 0.2s;
        }

        /* ── STATES ── */
        .state-wrap {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--muted);
        }
        .state-wrap .state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .state-wrap p { font-size: 1rem; }

        /* ── TOAST ── */
        .toast-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4444;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .toast-bar.show { transform: translateX(-50%) translateY(0); }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar d-flex justify-content-between align-items-center">
    <a href="/" class="navbar-brand">Auto<span>Lane</span></a>
    <div class="d-flex gap-2">
        <a href="/login" class="nav-btn">Login</a>
        <a href="/register" class="nav-btn filled">Sell a Car</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>Find Your<br/><em>Next Drive</em></h1>
    <p>Browse hundreds of verified second-hand cars listed by real sellers.</p>
    <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search by brand — Toyota, Honda, BMW..." />
        <button onclick="searchCars()">Search</button>
    </div>
</section>

<!-- LISTINGS -->
<div class="section-label">
    <h2>All Listings</h2>
    <span class="count" id="carCount">0</span>
    <div class="divider"></div>
</div>

<div class="car-grid" id="carGrid">
    <!-- Cards injected by JS -->
</div>

<!-- Loading / Empty states -->
<div id="loadingState" class="state-wrap">
    <span class="state-icon">⏳</span>
    <p>Loading listings...</p>
</div>
<div id="emptyState" class="state-wrap" style="display:none;">
    <span class="state-icon">🚗</span>
    <p>No cars found. Try a different search.</p>
</div>

<!-- Toast for errors -->
<div class="toast-bar" id="toastBar"></div>

<footer>
    <p>© 2025 AutoLane · SE1020 University Project</p>
</footer>

<script>
    // ── ENTRY POINT ──
    // When the page loads, fetch all cars immediately.
    document.addEventListener('DOMContentLoaded', () => {
        loadCars('/api/cars');

        // Allow pressing Enter in the search box
        document.getElementById('searchInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') searchCars();
        });
    });

    // ── FETCH ALL CARS ──
    // Calls GET /api/cars (public endpoint, no login needed)
    // or GET /api/cars/search?brand=... if a query is passed
    async function loadCars(url) {
        const grid = document.getElementById('carGrid');
        const loading = document.getElementById('loadingState');
        const empty = document.getElementById('emptyState');

        grid.innerHTML = '';
        loading.style.display = 'block';
        empty.style.display = 'none';

        try {
            const res = await fetch(url, { credentials: 'include' });

            if (!res.ok) throw new Error('Failed to load listings');

            const cars = await res.json();

            loading.style.display = 'none';
            document.getElementById('carCount').textContent = cars.length;

            if (cars.length === 0) {
                empty.style.display = 'block';
                return;
            }

            // Render each car as a card
            cars.forEach(car => {
                grid.appendChild(buildCard(car));
            });

        } catch (err) {
            loading.style.display = 'none';
            showToast('Could not connect to server. Is the backend running?');
        }
    }

    // ── BUILD A CARD ──
    // Takes one car object from the API and returns a DOM element.
    // The car object looks like: { id, brand, model, year, price, mileage, location, imagePath }
    function buildCard(car) {
        const card = document.createElement('div');
        card.className = 'car-card';
        card.onclick = () => window.location.href = `/car-detail?id=${car.id}`;

        // Image section — show placeholder if no image uploaded
        const imgHtml = car.imagePath
            ? `<img class="car-card-img" src="/uploads/${car.imagePath}" alt="${car.brand} ${car.model}" onerror="this.parentElement.innerHTML='<div class=\\'car-card-img-placeholder\\'>🚗</div>'">`
            : `<div class="car-card-img-placeholder">🚗</div>`;

        // Format price with commas
        const price = Number(car.price).toLocaleString('en-US');

        // Format mileage
        const mileage = Number(car.mileage).toLocaleString('en-US');

        card.innerHTML = `
        ${imgHtml}
        <div class="car-card-body">
          <div class="car-card-brand">${car.brand}</div>
          <div class="car-card-title">${car.brand} ${car.model}</div>
          <div class="car-card-meta">
            <span>${car.year}</span>
            <span>${mileage} km</span>
            ${car.location ? `<span>${car.location}</span>` : ''}
          </div>
          <div class="car-card-footer">
            <div class="car-card-price">$${price}</div>
            <span class="card-arrow">→</span>
          </div>
        </div>
      `;

        return card;
    }

    // ── SEARCH ──
    // Reads the search input and calls the search endpoint.
    // If empty, reloads all cars.
    function searchCars() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            loadCars('/api/cars');
        } else {
            loadCars(`/api/cars/search?brand=${encodeURIComponent(query)}`);
        }
    }

    // ── TOAST ──
    function showToast(msg) {
        const toast = document.getElementById('toastBar');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }
</script>

</body>
</html>
