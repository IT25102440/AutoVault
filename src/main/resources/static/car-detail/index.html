<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="/icns/favicon.png"/>
    <title>AutoLane — Car Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --black: #0d0d0d;
            --white: #f5f4f0;
            --accent: #e8ff47;
            --grey: #1a1a1a;
            --muted: #888;
            --card-bg: #161616;
            --border: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--black);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: var(--accent) !important;
            letter-spacing: 2px;
            text-decoration: none;
        }
        .navbar-brand span { color: var(--white); }
        .nav-btn {
            border: 1px solid var(--accent);
            color: var(--accent);
            background: transparent;
            padding: 0.4rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .nav-btn:hover { background: var(--accent); color: var(--black); }
        .nav-btn.filled { background: var(--accent); color: var(--black); }
        .nav-btn.filled:hover { background: transparent; color: var(--accent); }
        .nav-user-chip {
            display: flex;
            align-items: stretch;
            border: 1px solid var(--border);
            background: transparent;
            text-decoration: none;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .nav-user-chip:hover {
            border-color: var(--accent);
        }
        .nav-avatar {
            width: 32px;
            background: var(--accent);
            color: var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
        }
        .nav-username {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--white);
            white-space: nowrap;
            letter-spacing: 0;
            text-transform: none;
            padding: 0.35rem 1rem 0.35rem 0.7rem;
        }
        .nav-btn-logout {
            border-color: var(--border);
            color: var(--muted);
            letter-spacing: 0.5px;
        }
        .nav-btn-logout:hover {
            background: rgba(255,60,60,0.08);
            border-color: #ff4747;
            color: #ff4747;
        }

        /* ── BACK LINK ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 1.5rem 2rem 0;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        /* ── MAIN LAYOUT ── */
        .detail-wrap {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 768px) {
            .detail-wrap { grid-template-columns: 1fr; }
        }

        /* ── LEFT: IMAGE ── */
        .car-image-wrap {
            position: relative;
            overflow: hidden;
            background: var(--grey);
            aspect-ratio: 16/10;
        }
        .car-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .car-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--border);
        }

        /* ── RIGHT: INFO PANEL ── */
        .info-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            position: sticky;
            top: 90px;
        }

        .car-brand-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .car-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            line-height: 1;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .car-year {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .car-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* ── SPEC ROWS ── */
        .spec-list { margin-bottom: 1.5rem; }
        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .spec-row:last-child { border-bottom: none; }
        .spec-label {
            color: var(--muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .spec-value {
            font-weight: 500;
            color: var(--white);
        }

        /* ── SELLER BOX ── */
        .seller-box {
            background: var(--grey);
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .seller-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            margin-bottom: 0.3rem;
        }
        .seller-box .name {
            font-weight: 600;
            font-size: 1rem;
        }

        /* ── CTA BUTTON ── */
        .cta-btn {
            display: block;
            width: 100%;
            background: var(--accent);
            color: var(--black);
            border: none;
            padding: 1rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .cta-btn:hover { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

        /* ── STATES ── */
        .state-wrap {
            text-align: center;
            padding: 6rem 2rem;
            color: var(--muted);
        }
        .state-wrap .state-icon { font-size: 3rem; display: block; margin-bottom: 1rem; }

        /* ── TOAST ── */
        .toast-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4444;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .toast-bar.show { transform: translateX(-50%) translateY(0); }

        footer {
            border-top: 1px solid var(--border);
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar d-flex justify-content-between align-items-center">
    <a href="/" class="navbar-brand">Auto<span>Lane</span></a>
    <div class="d-flex gap-2 align-items-center" id="navActions">
        <a href="/login" class="nav-btn">Login</a>
        <a href="/register" class="nav-btn filled">Sign Up</a>
    </div>
</nav>

<!-- BACK LINK -->
<a href="/" class="back-link">← Back to listings</a>

<!-- LOADING STATE -->
<div id="loadingState" class="state-wrap">
    <span class="state-icon">⏳</span>
    <p>Loading car details...</p>
</div>

<!-- ERROR STATE -->
<div id="errorState" class="state-wrap" style="display:none;">
    <span class="state-icon">🚫</span>
    <p>Car not found or has been removed.</p>
    <a href="/" style="color: var(--accent); margin-top: 1rem; display:inline-block;">← Back to listings</a>
</div>

<!-- MAIN CONTENT — hidden until data loads -->
<div class="detail-wrap" id="detailWrap" style="display:none;">

    <!-- LEFT: Image -->
    <div>
        <div class="car-image-wrap" id="imageWrap">
            <div class="car-image-placeholder">🚗</div>
        </div>
    </div>

    <!-- RIGHT: Info Panel -->
    <div class="info-panel">
        <div class="car-brand-tag" id="carBrand"></div>
        <div class="car-title" id="carTitle"></div>
        <div class="car-year" id="carYear"></div>
        <div class="car-price" id="carPrice"></div>

        <div class="spec-list">
            <div class="spec-row">
                <span class="spec-label">Mileage</span>
                <span class="spec-value" id="carMileage"></span>
            </div>
            <div class="spec-row">
                <span class="spec-label">Location</span>
                <span class="spec-value" id="carLocation"></span>
            </div>
            <div class="spec-row">
                <span class="spec-label">Year</span>
                <span class="spec-value" id="carYearSpec"></span>
            </div>
        </div>

        <div class="seller-box">
            <div class="label">Listed by</div>
            <div class="name" id="sellerName"></div>
        </div>

        <button class="cta-btn" onclick="handleContact()">
            Contact Seller →
        </button>
    </div>

</div>

<div class="toast-bar" id="toastBar"></div>

<footer>
    <p>© 2026 AutoLane | WD.08.1.149</p>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initNav();

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if (!id) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            return;
        }

        loadCar(id);
    });

    async function initNav() {
        try {
            const res = await fetch('/api/auth/me', { credentials: 'include' });
            if (!res.ok) return;
            const user = await res.json();
            document.getElementById('navActions').innerHTML = `
                <a href="/${user.dashboard}" class="nav-user-chip">
                    <span class="nav-avatar">${user.name.charAt(0)}</span>
                    <span class="nav-username">${user.name}</span>
                </a>
                <button class="nav-btn nav-btn-logout" onclick="handleLogout()">Log Out</button>
            `;
        } catch (_) {}
    }

    async function handleLogout() {
        try {
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
        } catch (_) {}
        window.location.href = '/login';
    }

    async function loadCar(id) {
        try {
            const res = await fetch(`/api/cars/${id}`, { credentials: 'include' });

            if (!res.ok) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                return;
            }

            const car = await res.json();
            renderCar(car);

        } catch (err) {
            document.getElementById('loadingState').style.display = 'none';
            showToast('Could not load car details. Is the backend running?');
        }
    }

    function renderCar(car) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('detailWrap').style.display = 'grid';

        document.title = `AutoLane — ${car.brand} ${car.model}`;

        document.getElementById('carBrand').textContent = car.brand;
        document.getElementById('carTitle').textContent = `${car.brand} ${car.model}`;
        document.getElementById('carYear').textContent = `${car.year} · ${car.location || 'Location not specified'}`;
        document.getElementById('carPrice').textContent = `Rs. ${Number(car.price).toLocaleString('en-US')}`;
        document.getElementById('carMileage').textContent = `${Number(car.mileage).toLocaleString('en-US')} km`;
        document.getElementById('carLocation').textContent = car.location || 'Not specified';
        document.getElementById('carYearSpec').textContent = car.year;

        // seller is nested inside the car response
        if (car.seller && car.seller.name) {
            document.getElementById('sellerName').textContent = car.seller.name;
        } else if (car.sellerName) {
            document.getElementById('sellerName').textContent = car.sellerName;
        } else {
            document.getElementById('sellerName').textContent = 'Unknown seller';
        }

        if (car.imagePath) {
            document.getElementById('imageWrap').innerHTML =
                `<img src="/uploads/${car.imagePath}" alt="${car.brand} ${car.model}"
                onerror="this.parentElement.innerHTML='<div class=\\'car-image-placeholder\\'>🚗</div>'" />`;
        }
    }

    function handleContact() {
        showToast('Feature coming soon — contact your seller directly.');
    }

    function showToast(msg) {
        const toast = document.getElementById('toastBar');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }
</script>

</body>
</html>
